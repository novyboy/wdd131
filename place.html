<body class="flex-column">
	<header>
		<h1 id="title">Hawaii</h1>
	</header>
	<main class="flex-column">
		<picture id="background">
			<source srcset="images/hawaii-narrow.webp" media="(max-width: 48rem)" />
			<img src="images/hawaii-wide.webp" alt="Image of Hawaii" />
		</picture>
		<section class="card">
			<h2>Data</h2>
			<dl class="data">
				<div>
				  <dt>Area:</dt>
				  <dd>10,931 sq mi (28,311 km²)</dd>
				</div>
				<div>
				  <dt>Population:</dt>
				  <dd>1,430,688</dd>
				</div>
				<div>
				  <dt>Capital:</dt>
				  <dd>Honolulu</dd>
				</div>
				<div>
				  <dt>Languages:</dt>
				  <dd>English, Hawaiian</dd>
				</div>
				<div>
				  <dt>Currency:</dt>
				  <dd>United States Dollar (USD)</dd>
				</div>
				<div>
				  <dt>Time Zone:</dt>
				  <dd>UTC−10</dd>
				</div>
				<div>
				  <dt>Calling Code:</dt>
				  <dd>+1 (808)</dd>
				</div>
				<div>
				  <dt>Internet TLD:</dt>
				  <dd>.us</dd>
				</div>
			</dl>
		</section>
		<section class="card">
			<h2 id="weather">Weather</h2>
			<dl class="data">
				<div>
					<dt>Temperature:</dt>
					<dd id="temperature"></dd>
				</div>
				<div>
					<dt>Conditions:</dt>
					<dd id="conditions"></dd>
				</div>
				<div>
					<dt>Wind:</dt>
					<dd id="windSpeed"></dd>
				</div>
				<div>
					<dt>Wind Chill:</dt>
					<dd id="windChill"></dd>
				</div>
			</dl>
		</section>
	</main>
	<footer>
		<p>
			©︎<span id="currentYear"></span>
			🌺 Nova Sonomura
			🌺 Hawai ʻi
		</p>
		<p id="lastModified"></p>
	</footer>
