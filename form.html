<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<base target="_top">
	<title>Product Review Form</title>
	<meta property="og:title" content="Product Review Form">
	<meta name="description" content="A form used by customers and other people to review products">
	<meta name="author" content="Nova Sonomura">
	<meta property="og:description" content="A form used by customers and other people to review products">
	<meta property="og:type" content="website">
	
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:image:alt" content="Product Review Form">
	
	<link rel="stylesheet" href="styles/form.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Caveat:wght@400..700&family=Mali:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Oi&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
	
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="">
	<meta name="theme-color" content="">
	<script src="scripts/getdates.js" defer></script>
	<script src="scripts/form.js" defer></script>
</head>
<body class="flex-column">
	<header>
		<h1 id="title">Product Review Form</h1>
	</header>
	<main class="flex-column">
		<form class="flex-column" method="get" action="/review.html">
			<label for="productName">Product Name</label>
			<select id="productName" name="productName" required>
				<option disabled selected>Select a product...</option>
			</select>
			
			<fieldset id="overallRating">
				<legend for="overallRating">Overall Rating</legend>
				<input type="radio" id="onestar" name="rating" value="1" required>
				<label for="onestar">★</label>
				<input type="radio" id="twostar" name="rating" value="2" required>
				<label for="twostar">★★</label>
				<input type="radio" id="threestar" name="rating" value="3" required>
				<label for="threestar">★★★</label>
				<input type="radio" id="fourstar" name="rating" value="4" required>
				<label for="fourstar">★★★★</label>
				<input type="radio" id="fivestar" name="rating" value="5" required>
				<label for="fivestar">★★★★★</label>
			</fieldset>
			<label for="date">
				Date of Installation
			</label>
			<input type="date" id="date" name="date" required/>
			<fieldset id="usefulFeatures" class="flex-column">
				<legend for="usefulFeatures">What features did you find useful in the product? (check all that apply)</legend>
				<label for="durability"><input type="checkbox" id="durability" name="feature" value="durability"/>
				Durability</label>
				<label for="easeOfUse"><input type="checkbox" id="easeOfUse" name="feature" value="easeOfUse"/>
				Ease of Use</label>
				<label for="performance"><input type="checkbox" id="performance" name="feature" value="performance"/>
				Performance</label>
				<label for="design"><input type="checkbox" id="design" name="feature" value="design"/>
				Design</label>
			</fieldset>
			
			<label for="review">Written Review</label>
			<textarea id="review" name="review" placeholder="Enter review here..."></textarea>
			
			<label for="name">Your Name</label>
			<input type="text" id="name" name="name" placeholder="Enter name here..."/>
			
			<input type="submit" value="Post Review"/>
		</form>
	</main>
	<footer>
		<p>
			©︎<span id="currentYear"></span>
			🌺 Nova Sonomura
			🌺 Hawai ʻi
		</p>
		<p id="lastModified"></p>
	</footer>
</body>

</html>
